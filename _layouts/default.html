<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111315" media="(prefers-color-scheme: dark)">

    <!-- Apply the saved or system theme before first paint -->
    <script>
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <title>{{ page.title | default: site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    
    <!-- Open Graph Metadata -->
    <meta property="og:title" content="{{ page.title | default: site.title }}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:image" content="{{ '/assets/images/og-card.jpg' | absolute_url }}">
    <meta property="og:image:alt" content="Headshot of Nathan Anderson">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="{{ page.url | absolute_url }}">

    <!-- JSON-LD Structured Data Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Nathan Anderson",
      "jobTitle": "Applied NLP Scientist",
      "alumniOf": {
        "@type": "CollegeOrUniversity",
        "name": "Carnegie Mellon University - Language Technologies Institute"
      },
      "url": "https://njand.github.io",
      "sameAs": [
        "https://github.com/njand",
        "https://huggingface.co/njand",
        "https://www.linkedin.com/in/njand/"
      ]
    }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="{{ '/assets/images/headshot.webp' | relative_url }}" type="image/webp">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">

    <!-- Compiled Tailwind Styles -->
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    
    {% include analytics.html %}
</head>
<body class="bg-bg text-body font-sans antialiased min-h-screen">
    <a href="#main" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-[60] btn-primary">Skip to content</a>
    {% include header.html %}
    
    <main id="main" class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 pt-28 sm:pt-32 pb-16 space-y-24 sm:space-y-32">
        {{ content }}
    </main>

    {% include footer.html %}
    
    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
