<header class="fixed top-0 left-0 right-0 z-50 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        <!-- Logo / Name -->
        <a href="/" class="text-lg font-bold tracking-tight text-slate-50 hover:text-sky-400 transition-colors flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-sky-400 animate-pulse"></span>
            Nathan Anderson
        </a>
        
        <!-- Desktop Navigation -->
        <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-400">
            <a href="#about" class="hover:text-sky-400 transition-colors">About</a>
            <a href="#flagships" class="hover:text-sky-400 transition-colors">Flagship Systems</a>
            <a href="#skills" class="hover:text-sky-400 transition-colors">Skills</a>
            <a href="#research" class="hover:text-sky-400 transition-colors">Research</a>
            <a href="#experience" class="hover:text-sky-400 transition-colors">Experience</a>
        </nav>

        <!-- Profile Links & Call to Action -->
        <div class="flex items-center space-x-3">
            <!-- GitHub -->
            <a href="https://github.com/njand" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-slate-100 transition-colors p-1 outbound-link" data-platform="GitHub" title="GitHub Profile">
                {% include icons/github.html %}
            </a>

            <!-- Hugging Face -->
            <a href="https://huggingface.co/njand" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-yellow-400 transition-colors p-1 outbound-link" data-platform="HuggingFace" title="Hugging Face Profile">
                {% include icons/huggingface.html %}
            </a>

            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/njand/" target="_blank" rel="noopener noreferrer" class="text-slate-400 hover:text-sky-400 transition-colors p-1 outbound-link" data-platform="LinkedIn" title="LinkedIn Profile">
                {% include icons/linkedin.html %}
            </a>

            <!-- Download Resume Button -->
            <a href="{{ '/assets/pdf/Nathan_Anderson_CV.pdf' | relative_url }}" id="download-cv-btn" target="_blank" download class="px-3.5 py-1.5 text-xs font-semibold rounded-md bg-sky-500 hover:bg-sky-400 text-slate-900 transition-all shadow-md shadow-sky-500/20">
                Download Resume
            </a>

            <!-- Mobile Hamburger Menu Button -->
            <button id="mobile-menu-toggle" type="button" class="md:hidden p-1.5 text-slate-400 hover:text-slate-100 focus:outline-none" aria-label="Toggle Navigation">
                <svg id="menu-icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg id="menu-icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation Dropdown Menu -->
    <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-slate-800 px-4 pt-2 pb-4 space-y-2 text-sm font-medium">
        <a href="#about" class="block py-2 text-slate-300 hover:text-sky-400 transition-colors">About</a>
        <a href="#flagships" class="block py-2 text-slate-300 hover:text-sky-400 transition-colors">Flagship Systems</a>
        <a href="#skills" class="block py-2 text-slate-300 hover:text-sky-400 transition-colors">Skills</a>
        <a href="#research" class="block py-2 text-slate-300 hover:text-sky-400 transition-colors">Research</a>
        <a href="#experience" class="block py-2 text-slate-300 hover:text-sky-400 transition-colors">Experience</a>
    </div>
</header>
